<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%">
  <style>
    .mono{font-family:'JetBrains Mono',Consolas,monospace}
    .serif{font-family:Georgia,serif}
    .card{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.4s ease-out forwards}
    .num{animation:glow 3s ease-in-out infinite}
    @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes glow{50%{fill:#fcd34d}}
  </style>
  <g id="c">
    <g class="card" style="animation-delay:.1s"><rect x="5" y="10" width="165" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="87" y="75" text-anchor="middle" class="serif num" font-size="46" fill="#f59e0b">5+</text><text x="87" y="105" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">years of writing</text><rect class="bar" style="animation-delay:.5s" x="25" y="130" width="125" height="4" rx="2" fill="#f59e0b"/></g>
    <g class="card" style="animation-delay:.3s"><rect x="185" y="10" width="165" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="267" y="75" text-anchor="middle" class="serif num" font-size="46" fill="#f59e0b">10.8K</text><text x="267" y="105" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">Medium followers</text><rect class="bar" style="animation-delay:.7s" x="205" y="130" width="125" height="4" rx="2" fill="#f59e0b"/></g>
    <g class="card" style="animation-delay:.5s"><rect x="365" y="10" width="165" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="447" y="75" text-anchor="middle" class="serif num" font-size="46" fill="#f59e0b">8.1M</text><text x="447" y="105" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">impressions, 1 article</text><rect class="bar" style="animation-delay:.9s" x="385" y="130" width="125" height="4" rx="2" fill="#f59e0b"/></g>
    <g class="card" style="animation-delay:.7s"><rect x="545" y="10" width="165" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="627" y="75" text-anchor="middle" class="serif num" font-size="46" fill="#f59e0b">766K</text><text x="627" y="105" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">views, 1 X post</text><rect class="bar" style="animation-delay:1.1s" x="565" y="130" width="125" height="4" rx="2" fill="#f59e0b"/></g>
    <g class="card" style="animation-delay:.9s"><rect x="725" y="10" width="165" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="807" y="75" text-anchor="middle" class="serif num" font-size="46" fill="#f59e0b">140+</text><text x="807" y="105" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">GeeksforGeeks articles</text><rect class="bar" style="animation-delay:1.3s" x="745" y="130" width="125" height="4" rx="2" fill="#f59e0b"/></g>
  </g>
</svg>
