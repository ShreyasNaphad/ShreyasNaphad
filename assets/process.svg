<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%"><style>
.m{font-family:'JetBrains Mono',Consolas,monospace}.s{font-family:Georgia,'Times New Roman',serif}
.card{fill:#161b22;stroke:#30363d}
</style><path id="pth" d="M110 70 H450 H790" stroke="#30363d" stroke-width="3" fill="none"/><path d="M110 70 H790" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 10" fill="none"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.2s" repeatCount="indefinite"/></path><circle cx="110" cy="70" r="34" fill="#161b22" stroke="#f59e0b" stroke-width="3"><animate attributeName="r" values="34;38;34" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<text class="m" x="110" y="77" text-anchor="middle" font-size="20" fill="#f59e0b">01</text>
<text class="s" x="110" y="140" text-anchor="middle" font-size="24" fill="#fff">We talk</text>
<text class="m" x="110" y="165" text-anchor="middle" font-size="11.5" fill="#9ca3af">30 min. I learn how you think and speak.</text><circle cx="450" cy="70" r="34" fill="#161b22" stroke="#f59e0b" stroke-width="3"><animate attributeName="r" values="34;38;34" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
<text class="m" x="450" y="77" text-anchor="middle" font-size="20" fill="#f59e0b">02</text>
<text class="s" x="450" y="140" text-anchor="middle" font-size="24" fill="#fff">I write</text>
<text class="m" x="450" y="165" text-anchor="middle" font-size="11.5" fill="#9ca3af">First draft within a week.</text><circle cx="790" cy="70" r="34" fill="#161b22" stroke="#f59e0b" stroke-width="3"><animate attributeName="r" values="34;38;34" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
<text class="m" x="790" y="77" text-anchor="middle" font-size="20" fill="#f59e0b">03</text>
<text class="s" x="790" y="140" text-anchor="middle" font-size="24" fill="#fff">You post</text>
<text class="m" x="790" y="165" text-anchor="middle" font-size="11.5" fill="#9ca3af">We keep what works, drop what doesn't.</text><circle r="7" fill="#fcd34d"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#pth"/></animateMotion></circle></svg>