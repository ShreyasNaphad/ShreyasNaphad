<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%"><style>
.m{font-family:'JetBrains Mono',Consolas,monospace}.s{font-family:Georgia,'Times New Roman',serif}
.card{fill:#161b22;stroke:#30363d}
</style><style>.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.05)}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2.2s ease-out infinite}@keyframes rg{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}</style>
<rect width="900" height="170" rx="18" fill="#161b22" stroke="#30363d"/>
<text class="s" x="450" y="62" text-anchor="middle" font-size="34" fill="#fff">Got something to say?</text>
<text class="s" x="450" y="100" text-anchor="middle" font-size="34" font-style="italic" fill="#f59e0b">Let's get it read.</text>
<rect class="ring" x="290" y="116" width="320" height="38" rx="19" fill="none" stroke="#f59e0b" stroke-width="2"/>
<g class="pulse"><rect x="290" y="116" width="320" height="38" rx="19" fill="#f59e0b"/><text class="m" x="450" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">shreyasnaphad@gmail.com</text></g></svg>